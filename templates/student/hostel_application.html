<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Hostel</title>
    <link rel="stylesheet" href="../static/css/apply_for_room.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="left">
        <img src="/static/images/dr.pd.jpg" class="logo">
        <span class="title">Dr. Panjabrao Deshmukh Polytechnic Hostel</span>
    </div>

    <div class="right">
        <i class="fa-solid fa-user"></i> Account
    </div>
</header>

<!-- Dashboard Layout -->
<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <a href="student_dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="apply_for_room.html" class="active"><i class="fa-solid fa-building"></i> Apply for a Hostel</a>
        <a  href="application_status.html"><i class="fa-solid fa-clipboard-check"></i> Application Status</a>
        <a href="room_details.html"><i class="fa-solid fa-bed"></i> Room Details</a>
        <a href="student_announcements.html"><i class="fa-solid fa-bell"></i> Announcements</a>
        <a href="student_complaints.html"><i class="fa-solid fa-bullhorn"></i> Complaints</a>
        <a href="profile.html"><i class="fa-solid fa-user"></i> My Profile</a
.--> 
        <a href="student_logout.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="content">

        <h2 class="page-title">Application Form</h2>

        <div class="form-box">

            <h3 class="section-title">Personal Information</h3>

            <div class="form-group">
                <label>Student Name</label>
                <input type="text" placeholder="Enter Full Name">
            </div>

            <div class="form-group">
                <label>Email ID</label>
                <input type="email" placeholder="Enter Email">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea placeholder="Enter Address"></textarea>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select>
                    <option>Select Course</option>
                    <option>CO1K</option>
                    <option>CO2K</option>
                    <option>CO3K</option>
                    <option>CR1K</option>
                    <option>CR2K</option>
                    <option>CR3K</option>
                    <option>EX1K</option>
                    <option>EX2K</option>
                    <option>EX3K</option>
                </select>
            </div>

            <h3 class="section-title">Upload Documents</h3>

            <div class="form-group">
                <label>ID Proof</label>
                <input type="file" accept=".pdf,.jpg,.png">
            </div>

            <div class="form-group">
                <label>Fee Receipt</label>
                <input type="file" accept=".pdf,.jpg,.png">
            </div>

            <div class="form-group">
                <label>Admission Receipt</label>
                <input type="file" accept=".pdf,.jpg,.png">
            </div>

            <div class="form-group">
                <label>Hostel Payment Receipt</label>
                <input type="file" accept=".pdf,.jpg,.png">
            </div>

            <div class="form-group">
                <label>Profile Photo</label>
                <input type="file" accept=".jpg,.png">
            </div>

            <div class="form-actions">
                <button class="cancel">Cancel</button>
                <button class="submit">Register</button>
            </div>
        </div>
    </main>
</div>

</body>
</html>
